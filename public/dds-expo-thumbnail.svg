<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="sphere" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.7" />
  <rect width="1200" height="630" fill="url(#sphere)" />

  <!-- Abstract Tech Circuit & Neural Nodes -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 700 150 L 850 150 L 950 250 L 1100 250" />
    <path d="M 800 300 L 920 300 L 1000 380 L 1150 380" />
    <path d="M 650 450 L 800 450 L 900 350 L 1050 350" />
    <circle cx="850" cy="150" r="4" fill="#38bdf8" />
    <circle cx="950" cy="250" r="5" fill="#60a5fa" />
    <circle cx="920" cy="300" r="4" fill="#38bdf8" />
    <circle cx="1000" cy="380" r="6" fill="#93c5fd" />
    <circle cx="900" cy="350" r="4" fill="#38bdf8" />
  </g>

  <!-- Header Badge: DDS News & DDS Expo AI 2026 -->
  <g transform="translate(80, 75)">
    <!-- Brand Box -->
    <rect width="64" height="64" rx="16" fill="#2563eb" />
    <text x="32" y="41" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" text-anchor="middle">DDS</text>
    
    <text x="80" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">DDS <tspan fill="#38bdf8">News</tspan></text>
    <text x="80" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" letter-spacing="2">KEYNOTE DISPATCH</text>

    <!-- Category Pill -->
    <rect x="760" y="10" width="280" height="44" rx="22" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="785" cy="32" r="6" fill="#ef4444" />
    <text x="800" y="38" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="1">DDS EXPO AI 2026 SUMMIT</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5">
      Next-Gen Autonomous Agents &amp;
    </text>
    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5">
      Enterprise Architecture Unveiled
    </text>

    <!-- Subtitle Summary -->
    <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" width="900">
      Sub-100ms multi-agent reasoning, self-healing code pipelines &amp; edge inferencing.
    </text>
  </g>

  <!-- Metrics & Highlights Cards -->
  <g transform="translate(80, 440)">
    <!-- Card 1 -->
    <rect width="320" height="110" rx="20" fill="url(#cardGlow)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="24" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32">&lt; 100ms</text>
    <text x="24" y="78" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15">Cognitive Reasoning Latency</text>

    <!-- Card 2 -->
    <rect x="345" width="340" height="110" rx="20" fill="url(#cardGlow)" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="369" y="44" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32">Autonomous</text>
    <text x="369" y="78" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15">Multi-Agent Orchestration</text>

    <!-- Card 3 -->
    <rect x="710" width="330" height="110" rx="20" fill="url(#cardGlow)" stroke="#1e3a8a" stroke-width="1.5" />
    <text x="734" y="44" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32">Zero Lock-in</text>
    <text x="734" y="78" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15">Open Tooling Architecture</text>
  </g>

  <!-- Bottom Strip -->
  <line x1="80" y1="590" x2="1120" y2="590" stroke="#1e293b" stroke-width="1" />
</svg>
